<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#FDFBF7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Tusic | Devotional</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Yatra+One&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --theme-red: #8b1515;
            --theme-gold: #b38b22;
            --theme-gold-light: #e6d8b3;
            --text-dark: #1a1a1a;
            --page-bg: #FDFBF7;
            --body-bg: #EAE3D2;
        }

        html {
            scroll-behavior: smooth; /* App-like navigation */
            -webkit-tap-highlight-color: transparent;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--body-bg);
            background-image: radial-gradient(circle at top center, #f3eedc, var(--body-bg));
            color: var(--text-dark);
            line-height: 1.5;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .devnagari { font-family: 'Noto Sans Devanagari', sans-serif; }
        .heading-font { font-family: 'Yatra One', system-ui; }

        /* --- Floating App Toolbar --- */
        .toolbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: rgba(253, 251, 247, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(230, 216, 179, 0.5);
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
        }

        .toolbar-title {
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--theme-red);
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toolbar-title svg {
            color: var(--theme-gold);
        }

        .btn {
            background: var(--theme-red);
            color: white;
            border: none;
            padding: 7px 16px;
            border-radius: 50px; /* Pill shape for app feel */
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 12px rgba(139, 21, 21, 0.2);
        }

        .btn:hover, .btn:active { 
            background: #7a1212; 
            transform: translateY(-2px) scale(1.02); 
            box-shadow: 0 6px 16px rgba(139, 21, 21, 0.3);
        }

        /* --- Global Structural Classes --- */
        @keyframes pageEntrance {
            from { opacity: 0; transform: translateY(15px) scale(0.99); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .page {
            background: var(--page-bg);
            position: relative;
            box-shadow: 0 12px 40px rgba(0,0,0,0.06);
            overflow: hidden;
            animation: pageEntrance 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }

        .page-inner {
            display: flex;
            flex-direction: column;
            z-index: 2;
            border: 1px solid var(--theme-red);
        }

        .page-inner::before {
            content: '';
            position: absolute;
            top: 3px; bottom: 3px; left: 3px; right: 3px;
            border: 1px solid rgba(179, 139, 34, 0.3);
            pointer-events: none;
        }

        /* Ultra-Clean Geometric Corners */
        .corner-container { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
        .svg-corner {
            position: absolute;
            width: 20px; height: 20px;
            color: var(--theme-red);
        }
        .corner-tl { top: -1px; left: -1px; border-top: 2px solid currentColor; border-left: 2px solid currentColor; }
        .corner-tr { top: -1px; right: -1px; border-top: 2px solid currentColor; border-right: 2px solid currentColor; }
        .corner-bl { bottom: -1px; left: -1px; border-bottom: 2px solid currentColor; border-left: 2px solid currentColor; }
        .corner-br { bottom: -1px; right: -1px; border-bottom: 2px solid currentColor; border-right: 2px solid currentColor; }

        .watermark {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 80%; height: 80%;
            opacity: 0.025;
            z-index: 1;
            pointer-events: none;
            color: var(--theme-red);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page-header {
            text-align: center;
            margin-bottom: 25px;
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title-eng {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--theme-gold);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 4px;
        }

        .subtitle-hin {
            font-size: 1.7rem;
            color: var(--theme-red);
            line-height: 1.2;
            text-shadow: 0 2px 4px rgba(139, 21, 21, 0.05);
        }

        .divider-line {
            width: 80px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--theme-gold), transparent);
            margin-top: 14px;
            border-radius: 2px;
        }

        /* --- Listen to Mom's Voice Button --- */
        .listen-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 15px;
            padding: 8px 18px;
            background: transparent;
            border: 1px solid var(--theme-red);
            color: var(--theme-red);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 50px;
            transition: all 0.2s ease;
        }
        
        .listen-btn:hover, .listen-btn:active {
            background: rgba(139, 21, 21, 0.05);
            transform: translateY(-1px);
        }

        .listen-btn svg {
            fill: var(--theme-red);
        }

        .aarti-grid {
            display: grid;
            flex-grow: 1;
            z-index: 2;
            position: relative;
            margin-top: 5px;
        }

        .column-title {
            text-align: center;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--theme-gold);
            margin-bottom: 18px;
            font-weight: 700;
            opacity: 0.8;
        }

        .text-devnagari, .text-hinglish {
            font-size: 0.95rem; 
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .text-devnagari { color: var(--theme-red); font-weight: 500; }
        .text-hinglish { color: var(--text-dark); font-weight: 400; }

        .stanza {
            white-space: pre-wrap;
            line-height: 1.6;
        }

        .page-footer {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-top: 1px solid rgba(230, 216, 179, 0.4);
            padding-top: 12px;
            z-index: 2;
        }

        .footer-family {
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--theme-gold);
            flex-grow: 1;
            text-align: center;
            padding-left: 25px; 
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.8;
        }

        .page-number {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--theme-red);
            width: 25px;
            text-align: right;
        }

        /* --- App-like Index List --- */
        .index-instruction {
            text-align: center;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--theme-gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .index-list {
            list-style: none;
            width: 100%;
            padding: 0;
            margin: auto 0;
            z-index: 2;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .index-item a {
            text-decoration: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(230, 216, 179, 0.3);
            transition: all 0.2s ease;
        }

        .index-item a:hover, .index-item a:active { 
            background: white;
            transform: scale(1.01);
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border-color: var(--theme-gold-light);
        }

        .index-name { font-weight: 600; font-size: 1.05rem; color: var(--text-dark); margin-bottom: 3px;}
        .index-hin { font-size: 1.1rem; color: var(--theme-red); font-weight: 500;}
        .index-pg { 
            font-size: 0.85rem; 
            font-weight: 700; 
            color: var(--theme-red);
            background: rgba(230, 216, 179, 0.3);
            width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
        }

        /* =========================================
           FAB & BOTTOM SHEET NAV SPECIFIC STYLES 
           ========================================= */
        .fab-container {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 1000;
        }

        .fab-btn {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: var(--theme-red);
            color: white;
            border: none;
            box-shadow: 0 6px 20px rgba(139, 21, 21, 0.4);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .fab-btn:hover, .fab-btn:active {
            transform: scale(1.05) translateY(-2px);
            background: #7a1212;
            box-shadow: 0 8px 25px rgba(139, 21, 21, 0.5);
        }

        .sheet-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            z-index: 1001;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
        }

        .sheet-backdrop.active {
            opacity: 1;
            visibility: visible;
        }

        .bottom-sheet {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(253, 251, 247, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 28px 28px 0 0;
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.15);
            z-index: 1002;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            display: flex;
            flex-direction: column;
            max-height: 85vh;
            border-top: 1px solid rgba(230, 216, 179, 0.8);
        }

        .bottom-sheet.active {
            transform: translateY(0);
        }

        .bottom-sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 25px 15px;
            border-bottom: 1px solid rgba(230, 216, 179, 0.4);
        }

        .bottom-sheet-title {
            font-size: 1.4rem;
            color: var(--theme-red);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .close-btn {
            background: rgba(230, 216, 179, 0.4);
            border: none;
            color: var(--theme-red);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .close-btn:hover, .close-btn:active {
            background: var(--theme-red);
            color: white;
            transform: scale(1.05);
        }

        .bottom-sheet-content {
            padding: 20px 25px 30px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* Desktop specific positioning for the FAB and Sheet to look natural on large screens */
        @media screen and (min-width: 768px) {
            .bottom-sheet {
                left: 50%;
                width: 100%;
                max-width: 600px;
                transform: translate(-50%, 100%);
            }
            .bottom-sheet.active {
                transform: translate(-50%, 0);
            }
            .fab-container {
                right: max(25px, calc(50vw - 380px)); /* Keeps it nicely aligned next to the reading area */
            }
        }


        /* =========================================
           SCREEN (WEB APP / MOBILE) SPECIFIC LAYOUT 
           ========================================= */
        @media screen {
            .book-container {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 25px;
                padding: 75px 12px 100px 12px; /* Added extra bottom padding so FAB doesn't hide text */
                max-width: 800px;
                margin: 0 auto;
            }

            .page {
                width: 100%;
                border-radius: 16px;
                height: auto;
                min-height: 60vh;
                display: flex;
            }

            .page-inner {
                position: relative;
                width: 100%;
                margin: 6px; 
                padding: 25px 18px;
                border-radius: 10px;
            }

            .page-inner::before { border-radius: 8px; }

            .aarti-grid {
                grid-template-columns: 1fr;
                gap: 25px;
            }
            
            .aarti-column:first-child {
                border-bottom: 1px solid rgba(230, 216, 179, 0.4);
                padding-bottom: 25px;
                position: relative;
            }

            .aarti-column:first-child::after {
                content: '♦';
                position: absolute;
                bottom: -8px;
                left: 50%;
                transform: translateX(-50%);
                color: var(--theme-gold);
                font-size: 10px;
                background: var(--page-bg);
                padding: 0 10px;
            }

            @media (max-width: 400px) {
                .toolbar { padding: 10px 15px; }
                .toolbar-title { font-size: 1.1rem; }
                .btn { padding: 6px 12px; font-size: 0.75rem; }
                .subtitle-hin { font-size: 1.5rem; }
                .text-devnagari, .text-hinglish { font-size: 0.9rem; }
            }

            @media (min-width: 768px) {
                .book-container { padding: 90px 20px 100px 20px; }
                .page-inner { margin: 10px; padding: 35px 30px; }
                .aarti-grid { grid-template-columns: 1fr 1fr; gap: 40px; }
                .aarti-column:first-child { border-bottom: none; padding-bottom: 0; }
                .aarti-column:first-child::after { display: none; }
                .aarti-grid::after {
                    content: '';
                    position: absolute;
                    top: 0; bottom: 10px; left: 50%;
                    width: 1px;
                    background: linear-gradient(to bottom, transparent, rgba(230, 216, 179, 0.5), transparent);
                    transform: translateX(-50%);
                }
            }
        }


        /* =========================================
           PRINT (A4 STRICT) SPECIFIC LAYOUT 
           ========================================= */
        @media print {
            .no-print { display: none !important; }
            html { scroll-behavior: auto !important; }
            @page { size: A4 portrait; margin: 0 !important; }
            body { background: white; margin: 0; padding: 0; background-image: none; }
            .toolbar { display: none !important; }
            .book-container { margin: 0; padding: 0; display: block; gap: 0; max-width: none; }
            
            .page {
                width: 210mm !important;
                height: 297mm !important;
                margin: 0 !important;
                padding: 0 !important;
                box-shadow: none !important;
                border-radius: 0 !important;
                page-break-after: always !important;
                break-after: page !important;
                transform: none !important; 
                animation: none !important;
                min-height: 0 !important;
                display: block !important;
            }

            .page-inner {
                position: absolute;
                top: 10mm; bottom: 10mm; left: 10mm; right: 10mm;
                padding: 20px 25px;
                margin: 0 !important; 
                border-radius: 0 !important;
            }
            .page-inner::before { border-radius: 0 !important; }

            /* Normalize the Listen button for print */
            .listen-btn {
                border: 1px solid #aaa !important;
                color: #555 !important;
                background: #fff !important;
                margin-top: 10px !important;
                padding: 6px 14px !important;
            }
            .listen-btn svg { fill: #555 !important; }

            .aarti-grid {
                grid-template-columns: 1fr 1fr !important;
                gap: 30px !important;
            }
            
            .aarti-column:first-child { border-bottom: none !important; padding-bottom: 0 !important; }
            .aarti-column:first-child::after { display: none !important; }

            .aarti-grid::after {
                content: '';
                position: absolute;
                top: 0; bottom: 10px; left: 50%;
                width: 1px;
                background: linear-gradient(to bottom, transparent, var(--theme-gold-light), transparent);
                transform: translateX(-50%);
            }

            /* Links inherently create PDF bookmarks. We format the index list strictly. */
            .index-item a { border: none; background: transparent; padding: 8px 0; border-bottom: 1px solid var(--theme-gold-light); border-radius: 0; }
            .index-pg { background: transparent; width: auto; height: auto; }

            /* --- EXTREME COMPACT MODE FOR HANUMAN CHALISA IN PRINT --- */
            .long-aarti .page-inner { padding: 12px 15px; }
            .long-aarti .page-header { margin-bottom: 8px; }
            .long-aarti .listen-btn { margin-top: 6px !important; padding: 4px 12px !important; font-size: 0.7rem !important; }
            .long-aarti .title-eng { font-size: 0.8rem; margin-bottom: 2px; }
            .long-aarti .subtitle-hin { font-size: 1.2rem; }
            .long-aarti .divider-line { margin-top: 6px; }
            .long-aarti .aarti-grid { gap: 15px !important; margin-top: 2px; }
            .long-aarti .column-title { margin-bottom: 6px; font-size: 0.6rem; }
            .long-aarti .text-devnagari, .long-aarti .text-hinglish { font-size: 0.68rem; gap: 3px; }
            .long-aarti .stanza { line-height: 1.2; letter-spacing: 0.1px; }
        }
    </style>
</head>
<body>

    <!-- Floating App Toolbar -->
    <div class="toolbar">
        <div class="toolbar-title">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 18V5l12-2v13"></path>
                <circle cx="6" cy="18" r="3"></circle>
                <circle cx="18" cy="16" r="3"></circle>
            </svg>
            Tusic
        </div>
        <button class="btn" onclick="window.print()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 6 2 18 2 18 9"></polyline>
                <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                <rect x="6" y="14" width="12" height="8"></rect>
            </svg>
            Print
        </button>
    </div>

    <div class="book-container">
        <!-- INDEX PAGE -->
        <div class="page" style="animation-delay: 0.1s;">
            <div class="page-inner">
                <svg class="watermark" viewBox="0 0 100 100">
                    <text x="50" y="55" font-family="'Noto Sans Devanagari', sans-serif" font-size="70" text-anchor="middle" dominant-baseline="middle" font-weight="700">ॐ</text>
                </svg>
                <div class="corner-container" id="index-corners"></div>
                
                <div class="page-header" style="margin-top: 25px;">
                    <h1 class="title-eng">Index</h1>
                    <h2 class="subtitle-hin heading-font">अनुक्रमणिका</h2>
                    <div class="divider-line"></div>
                </div>
                
                <div class="aarti-content" style="display: flex; flex-direction: column; flex-grow: 1; margin-top: 10px;">
                    
                    <!-- Instruction to open the Aarti, hidden during PDF print -->
                    <div class="index-instruction no-print">
                        Click here to open
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>
                    </div>

                    <ul class="index-list" id="index-list">
                        <!-- JS injects index here -->
                    </ul>
                </div>

                <div class="page-footer">
                    <div class="footer-family">॥ PDF by Surekha Kailash Sonar ॥</div>
                    <div class="page-number">i</div>
                </div>
            </div>
        </div>

        <!-- CONTENT PAGES -->
        <div id="content-pages" style="display: contents;"></div>
    </div>

    <!-- MODAL BACKDROP -->
    <div class="sheet-backdrop no-print" id="sheet-backdrop"></div>

    <!-- BOTTOM SHEET NAV -->
    <div class="bottom-sheet no-print" id="bottom-sheet">
        <div class="bottom-sheet-header">
            <div class="bottom-sheet-title heading-font">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="8" y1="6" x2="21" y2="6"></line>
                    <line x1="8" y1="12" x2="21" y2="12"></line>
                    <line x1="8" y1="18" x2="21" y2="18"></line>
                    <line x1="3" y1="6" x2="3.01" y2="6"></line>
                    <line x1="3" y1="12" x2="3.01" y2="12"></line>
                    <line x1="3" y1="18" x2="3.01" y2="18"></line>
                </svg>
                अनुक्रमणिका
            </div>
            <button class="close-btn" id="close-sheet" aria-label="Close Index">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        <div class="bottom-sheet-content">
            <ul class="index-list" id="modal-index-list">
                <!-- JS injects modal index here -->
            </ul>
        </div>
    </div>

    <!-- FLOATING ACTION BUTTON (FAB) -->
    <div class="fab-container no-print">
        <button class="fab-btn" id="fab-btn" aria-label="Open Index">
            <svg width="34" height="34" viewBox="0 0 100 100">
                <text x="50" y="58" font-family="'Noto Sans Devanagari', sans-serif" font-size="65" fill="currentColor" text-anchor="middle" dominant-baseline="middle" font-weight="700">ॐ</text>
            </svg>
        </button>
    </div>

    <script>
        function injectCorners() {
            return `
                <div class="svg-corner corner-tl"></div>
                <div class="svg-corner corner-tr"></div>
                <div class="svg-corner corner-bl"></div>
                <div class="svg-corner corner-br"></div>
            `;
        }

        document.getElementById('index-corners').innerHTML = injectCorners();

        function formatStanzas(text) {
            return text.trim().split('\n\n').map(stanza => `<div class="stanza">${stanza}</div>`).join('');
        }

        const aartis = [
            {
                title: "Vakratunda Mahakaya",
                subtitle: "वक्रतुण्ड महाकाय",
                devnagari: `वक्रतुण्ड महाकाय सूर्यकोटि समप्रभ।\nनिर्विघ्नं कुरु मे देव सर्वकार्येषु सर्वदा॥`,
                hinglish: `Vakratunda Mahakaya Suryakoti Samaprabha |\nNirvighnam Kuru Me Deva Sarva Karyeshu Sarvada ||`
            },
            {
                title: "Shubham Karoti",
                subtitle: "शुभं करोति कल्याणम्",
                devnagari: `शुभं करोति कल्याणम् आरोग्यं धनसंपदा।\nशत्रुबुद्धिविनाशाय दीपज्योतिर्नमोऽस्तु ते॥`,
                hinglish: `Shubham Karoti Kalyanam, Arogyam Dhana Sampada |\nShatru Buddhi Vinashaya, Deepak Jyoti Namostute ||`
            },
            {
                title: "Ganpatichi Aarti",
                subtitle: "सुखकर्ता दुखहर्ता",
                devnagari: `सुखकर्ता दुखहर्ता वार्ता विघ्नाची।\nनुरवी पूर्वी प्रेम कृपा जयाची।\nसर्वांगी सुंदर उटी शेंदुराची।\nकंठी झळके माळ मुक्ताफळांची॥\n\nजय देव जय देव जय मंगलमूर्ती।\nदर्शनमात्रे मनकामना पुरती॥\n\nरत्नखचित फरा तूज गौरीकुमरा।\nचंदनाची उटी कुमकुमकेशरा।\nहिरे जडित मुकुट शोभतो बरा।\nरुणझुणती नुपुरे चरणी घागरिया॥ जय देव...\n\nलंबोदर पीतांबर फणी वरवंदना।\nसरळ सोंड वक्रतुंड त्रिनयना।\nदास रामाचा वाट पाहे सदना।\nसंकटी पावावे निर्वाणी रक्षावे सुरवरवंदना॥ जय देव...`,
                hinglish: `Sukhkarta dukhaharta varta vighnachi |\nNuruvi purvi prem krupa jayachi |\nSarvangi sundar uti shendurachi |\nKanthi jhalke maal muktaphalanchi ||\n\nJai dev jai dev, jai mangalmurti |\nDarshanmatre mankamana purti ||\n\nRatnakhachit phara tuj gaurikumara |\nChandanachi uti kumkumkeshara |\nHire jadit mukut shobhato bara |\nRunzhunti nupure charani ghagariya || Jai dev...\n\nLambodar pitambar phani varvandana |\nSaral sond vakratund trinayana |\nDas ramacha vat pahe sadana |\nSankati pavave nirvani rakshave survarvandana || Jai dev...`
            },
            {
                title: "Shiv Aarti",
                subtitle: "लवथवती विक्राळा",
                devnagari: `लवथवती विक्राळा ब्रह्मांडी माळा।\nवीषें कंठ काळा त्रिनेत्रीं ज्वाळा।\nलावण्यसुंदर मस्तकीं बाळा।\nतेथुनिया जळ वाहे निर्मळा॥\n\nजय देव जय देव जय श्रीशंकरा।\nआरती ओवाळू तुज कर्पूरगौरा॥\n\nकर्पूरगौरा भोळा नयनीं विशाळा।\nअर्धांगी पार्वती सुमनांच्या माळा।\nविभूतीचे उधळण शितिकंठ नीळा।\nऐसा शंकर शोभे उमावेल्हाळा॥ जय देव...\n\nदेवीं दैत्यीं सागरमंथन पैं केलें।\nत्यामाजी अवचित हलाहल जे उठलें।\nतें त्वां असुरपणे प्राशन केलें।\nनीळकंठ नाम प्रसिद्ध झालें॥ जय देव...\n\nव्याघ्रांबर फणिवरधर सुंदर मदनारी।\nपंचानन मनमोहन मुनिजनसुखकारी।\nशतकोटींचे बीज वाचे उच्चारी।\nरघुकुळटिळक रामदासा अंतरी॥ जय देव...`,
                hinglish: `Lavthavti vikrala brahmandi mala |\nVishe kanth kala trinetri jwala |\nLavanyasundar mastaki bala |\nTethuniya jal vahe nirmala ||\n\nJai dev jai dev jai shri shankara |\nAarti owalu tuj karpurgaura ||\n\nKarpurgaura bhola nayani vishala |\nArdhangi parvati sumananchya mala |\nVibhutiche udhalan shitikanth nila |\nAisa shankar shobhe umavelhala || Jai dev...\n\nDevi daityi sagarmanthan pai kele |\nTyamaji avachit halahal je uthale |\nTe tva asurpane prashan kele |\nNilkanth naam prasiddha jhale || Jai dev...\n\nVyaghrambar phanivardhar sundar madanari |\nPanchanan manmohan munijansukhakari |\nShatkotiche beej vache ucchari |\nRaghukultilak ramdasa antari || Jai dev...`
            },
            {
                title: "Durga Aarti",
                subtitle: "दुर्गे दुर्घट भारी",
                devnagari: `दुर्गे दुर्घट भारी तुजविण संसारी।\nअनाथनाथे अंबे करुणा विस्तारी।\nवारी वारी जन्ममरणांते वारी।\nहारी पडलो आता संकट निवारी॥\n\nजय देवी जय देवी जय महिषासुरमथनी।\nसुरवरईश्वरवरदे तारक संजीवनी॥\n\nत्रिभुवनभुवनी पाहता तुजऐसी नाही।\nचारी श्रमले परंतु न बोलवे काही।\nसाही विवाद करिता पडले प्रवाही।\nते तू भक्तालागी पावसि लवलाही॥ जय देवी...\n\nप्रसन्न वदने प्रसन्न होसी निजदासा।\nक्लेशांपासुनि सोडी तोडी भवपाशा।\nअंबे तुजवाचून कोण पुरवील आशा।\nनरहरि तल्लीन झाला पदपंकजलेशा॥ जय देवी...`,
                hinglish: `Durge durghat bhari tujavin sansari |\nAnathnathe ambe karuna vistari |\nVari vari janmamaranante vari |\nHari padlo aata sankat nivari ||\n\nJai devi jai devi jai mahishasurmathani |\nSurvarishvarvarde tarak sanjivani ||\n\nTribhuvanbhuvani pahata tujhaisi nahi |\nChari shramle parantu na bolve kahi |\nSahi vivad karita padle pravahi |\nTe tu bhaktalagi pavasi lavlahi || Jai devi...\n\nPrasanna vadane prasanna hosi nijadasa |\nKleshampasuni sodi todi bhavpasha |\nAmbe tujvachun kon purvil aasha |\nNarhari tallin jhala padpankajlesha || Jai devi...`
            },
            {
                title: "Vitthal Aarti",
                subtitle: "येई हो विठ्ठले",
                devnagari: `येई हो विठ्ठले माझे माऊली ये।\nनिढळावरी कर ठेवुनि वाट मी पाहे॥\n\nआलिया गेलिया हातीं धाडी निरोप।\nपंढरपुरीं आहे माझा मायबाप॥ येई हो...\n\nपिवळा पीतांबर कैसा गगनीं झळकला।\nगरुडावरी बैसून माझा कैवारी आला॥ येई हो...\n\nविठोबाचे राज आम्हां नित्य दिपवाळी।\nविष्णूदास नामा जीवेभावे ओवाळी॥ येई हो...`,
                hinglish: `Yei ho Vitthale majhe mauli ye |\nNidhalavari kar thevuni vaat mi pahe ||\n\nAaliya geliya hati dhadi nirop |\nPandharpuri aahe majha maybaap || Yei ho...\n\nPivala pitambar kaisa gagani jhalkala |\nGarudavari baisun majha kaivari aala || Yei ho...\n\nVithobache raj aamha nitya dipavali |\nVishnudas nama jivebhave owali || Yei ho...`
            },
            {
                title: "Ghalin Lotangan",
                subtitle: "घालीन लोटांगण",
                devnagari: `घालीन लोटांगण, वंदीन चरण\nडोळ्यांनी पाहिन रूप तुझे ॥\nप्रेमें आलिंगिन, आनंदें पूजिन ।\nभावें ओवाळिन म्हणे नामा ॥१॥\n\nत्वमेव माता च पिता त्वमेव ।\nत्वमेव बंधुश्च सखा त्वमेव ।\nत्वमेव विद्या द्रविणं त्वमेव ।\nत्वमेव सर्वं मम देवदेव ॥२॥\n\nकायेन वाचा मनसेंद्रियैर्वा,\nबुद्ध्यात्मना वा प्रकृतिस्वभावात् ।\nकरोमि यद्यत् सकलं परस्मै,\nनारायणायेति समर्पयामि ॥३॥\n\nअच्युतं केशवं रामनारायणं\nकृष्णदामोदरं वासुदेवं हरि ।\nश्रीधरं माधवं गोपिकावल्लभं,\nजानकीनायकं रामचंद्रं भजे ॥४॥\n\nहरे राम हरे राम, राम राम हरे हरे,\nहरे कृष्ण हरे कृष्ण, कृष्ण कृष्ण हरे हरे ॥`,
                hinglish: `Ghalin lotangan, vandin charan\nDolyani pahin roop tujhe ||\nPreme alingin, anande pugin |\nBhave ovalin mhane nama || 1 ||\n\nTvameva mata cha pita tvameva |\nTvameva bandhushcha sakha tvameva |\nTvameva vidya dravinam tvameva |\nTvameva sarvam mama devadeva || 2 ||\n\nKayena vacha manasendriyairva,\nBuddhyatmana va prakritisvabhavat |\nKaromi yadyat sakalam parasmai,\nNarayanayeti samarpayami || 3 ||\n\nAchyutam keshavam ramanarayanam\nKrishnadamodaram vasudevam hari |\nShridharam madhavam gopikavallabham,\nJanakinayakam ramachandram bhaje || 4 ||\n\nHare Ram Hare Ram, Ram Ram Hare Hare,\nHare Krishna Hare Krishna, Krishna Krishna Hare Hare ||`
            },
            {
                title: "Karpur Gauram",
                subtitle: "कर्पूरगौरं",
                devnagari: `कर्पूरगौरं करुणावतारं संसारसारं भुजगेन्द्रहारम्।\nसदा वसन्तं हृदयारविन्दे भवं भवानीसहितं नमामि॥`,
                hinglish: `Karpur Gauram Karunavtaaram Sansaarsaram Bhujagendrahaaram |\nSada Vasantam Hrudayaravinde Bhavam Bhavanisahitam Namami ||`
            },
            {
                title: "Hanuman Chalisa",
                subtitle: "श्री हनुमान चालीसा",
                isLong: true,
                devnagari: `॥ दोहा ॥\nश्रीगुरु चरन सरोज रज, निज मनु मुकुरु सुधारि।\nबरनऊँ रघुबर बिमल जसु, जो दायकु फल चारि॥\nबुद्धिहीन तनु जानिके, सुमिरौं पवन-कुमार।\nबल बुधि विद्या देहु मोहिं, हरहु कलेस बिकार॥\n\n॥ चौपाई ॥\nजय हनुमान ज्ञान गुन सागर। जय कपीस तिहुँ लोक उजागर॥\nराम दूत अतुलित बल धामा। अंजनि-पुत्र पवनसुत नामा॥\nमहाबीर बिक्रम बजरंगी। कुमति निवार सुमति के संगी॥\nकंचन बरन बिराज सुबेसा। कानन कुण्डल कुंचित केसा॥\nहाथ बज्र औ ध्वजा बिराजै। काँधे मूँज जनेऊ साजै॥\nशंकर सुवन केसरी नंदन। तेज प्रताप महा जग वंदन॥\nविद्यावान गुनी अति चातुर। राम काज करिबे को आतुर॥\nप्रभु चरित्र सुनिबे को रसिया। राम लखन सीता मन बसिया॥\nसूक्ष्म रूप धरि सियहिं दिखावा। बिकट रूप धरि लंक जरावा॥\nभीम रूप धरि असुर संहारे। रामचंद्र के काज सँवारे॥\nलाय सजीवन लखन जियाए। श्रीरघुबीर हरषि उर लाए॥\nरघुपति कीन्ही बहुत बड़ाई। तुम मम प्रिय भरतहि सम भाई॥\nसहस बदन तुम्हरो जस गावैं। अस कहि श्रीपति कंठ लगावैं॥\nसनकादिक ब्रह्मादि मुनीसा। नारद सारद सहित अहीसा॥\nजम कुबेर दिगपाल जहाँ ते। कवि कोविद कहि सके कहाँ ते॥\nतुम उपकार सुग्रीवहिं कीन्हा। राम मिलाय राज पद दीन्हा॥\nतुम्हरो मंत्र बिभीषण माना। लंकेश्वर भए सब जग जाना॥\nजुग सहस्र योजन पर भानू। लील्यो ताहि मधुर फल जानू॥\nप्रभु मुद्रिका मेलि मुख माहीं। जलधि लाँघि गए अचरज नाहीं॥\nदुर्गम काज जगत के जेते। गुरु अनुग्रह तुम्हरे तेते॥\nराम दुआरे तुम रखवारे। होत न आज्ञा बिनु पैसारे॥\nसब सुख लहै तुम्हारी सरना। तुम रक्षक काहू को डरना॥\nआपन तेज सम्हारो आपै। तीनों लोक हाँक तें काँपै॥\nभूत पिशाच निकट नहिं आवै। महाबीर जब नाम सुनावै॥\nनासै रोग हरै सब पीरा। जपत निरंतर हनुमत बीरा॥\nसंकट तें हनुमान छुड़ावै। मन क्रम वचन ध्यान जो लावै॥\nसब पर राम तपस्वी राजा। तिन के काज सकल तुम साजा॥\nऔर मनोरथ जो कोई लावै। सोइ अमित जीवन फल पावै॥\nचारों जुग परताप तुम्हारा। है परसिद्ध जगत उजियारा॥\nसाधु संत के तुम रखवारे। असुर निकंदन राम दुलारे॥\nअष्ट सिद्धि नौ निधि के दाता। अस बर दीन जानकी माता॥\nराम रसायन तुम्हरे पासा। सदा रहो रघुपति के दासा॥\nतुम्हरे भजन राम को पावै। जनम जनम के दुख बिसरावै॥\nअंतकाल रघुवर पुर जाई। जहाँ जन्म हरि-भक्त कहाई॥\nऔर देवता चित्त न धरई। हनुमत सेइ सर्व सुख करई॥\nसंकट कटै मिटै सब पीरा। जो सुमिरै हनुमत बलबीरा॥\nजय जय जय हनुमान गोसाईं। कृपा करहु गुरुदेव की नाईं॥\nजो सत बार पाठ कर कोई। छूटहि बंदि महा सुख होई॥\nजो यह पढ़ै हनुमान चालीसा। होय सिद्धि साखी गौरीसा॥\nतुलसीदास सदा हरि चेरा। कीजै नाथ हृदय महँ डेरा॥\n\n॥ दोहा ॥\nपवनतनय संकट हरन, मंगल मूरति रूप।\nराम लखन सीता सहित, हृदय बसहु सुर भूप॥`,
                hinglish: `|| Doha ||\nShreeguru charan saroj raj, nij manu mukuru sudhaari |\nBaranau raghubar bimal jasu, jo daayaku phal chaari ||\nBuddhiheen tanu jaanike, sumirau pavan-kumaar |\nBal budhi vidya dehu mohi, harahu kales bikaar ||\n\n|| Chaupai ||\nJai Hanuman gyaan gun saagar | Jai kapees tihun lok ujaagar ||\nRam doot atulit bal dhaama | Anjani-putra pavansut naama ||\nMahabeer bikram bajrangi | Kumati nivaar sumati ke sangi ||\nKanchan baran biraaj subesa | Kaanan kundal kunchit kesa ||\nHaath bajra au dhvaja biraajai | Kaandhe moonj janeu saajai ||\nShankar suvan kesari nandan | Tej prataap maha jag vandan ||\nVidyavaan guni ati chaatur | Ram kaaj karibe ko aatur ||\nPrabhu charitra sunibe ko rasiya | Ram lakhan sita man basiya ||\nSukshma roop dhari siyahi dikhaava | Bikat roop dhari lank jaraava ||\nBheem roop dhari asur sanhaare | Ramachandra ke kaaj sanvaare ||\nLaay sajivan lakhan jiyaaye | Shree raghubeer harashi ur laaye ||\nRaghupati keenhi bahut badhaayi | Tum mam priya bharatahi sam bhaayi ||\nSahas badan tumharo jas gaavai | As kahi shreepati kanth lagaavai ||\nSanakaadik brahmaadi muneesa | Naarad saarad sahit aheesa ||\nJam kuber digpaal jahan te | Kavi kovid kahi sake kahan te ||\nTum upkaar sugreevahin keenha | Ram milaay raaj pad deenha ||\nTumharo mantra bibheeshan maana | Lankeshwar bhaye sab jag jaana ||\nJug sahasra yojan par bhaanoo | Leelyo taahi madhur phal jaanoo ||\nPrabhu mudrika meli mukh maahin | Jaladhi laanghi gaye acharaj naahin ||\nDurgam kaaj jagat ke jete | Sugam anugrah tumhre tete ||\nRam duaare tum rakhvaare | Hot na aagya binu paisaare ||\nSab sukh lahai tumhaari sarna | Tum rakshak kaahu ko darna ||\nAapan tej samhaaro aapai | Teeno lok haank te kaanpai ||\nBhoot pishaach nikat nahin aavai | Mahabeer jab naam sunaavai ||\nNaasai rog harai sab peera | Japat nirantar hanumat beera ||\nSankat te hanuman chhudaavai | Man kram bachan dhyaan jo laavai ||\nSab par ram tapasvee raaja | Tin ke kaaj sakal tum saaja ||\nAur manorath jo koyi laavai | Soyi amit jeevan phal paavai ||\nChaaro jug partaap tumhaara | Hai parsiddh jagat ujiyaara ||\nSaadhu sant ke tum rakhvaare | Asur nikandan ram dulaare ||\nAsht siddhi nau nidhi ke daata | As bar deen jaanki maata ||\nRam rasayan tumhre paasa | Sada raho raghupati ke daasa ||\nTumhre bhajan ram ko paavai | Janam janam ke dukh bisraavai ||\nAntakaal raghuvar pur jaayi | Jahan janm hari-bhakt kahaayi ||\nAur devata chitt na dharayi | Hanumat seyi sarv sukh karayi ||\nSankat katai mitai sab peera | Jo sumirai hanumat balbeera ||\nJai jai jai hanuman gosaayi | Kripa karahu gurudev ki naayi ||\nJo sat baar paath kar koyi | Chhootahi bandi maha sukh hoyi ||\nJo yah padhai hanuman chaleesa | Hoy siddhi saakhi gaureesa ||\nTulsidaas sada hari chera | Keejai naath hriday mahan dera ||\n\n|| Doha ||\nPavantanay sankat haran, mangal moorati roop |\nRam lakhan sita sahit, hriday basahu sur bhoop ||`
            },
            {
                title: "Gayatri Mantra",
                subtitle: "गायत्री मंत्र",
                devnagari: `ॐ भूर्भुवः स्वः।\nतत्सवितुर्वरेण्यं भर्गो देवस्य धीमहि।\nधियो यो नः प्रचोदयात्॥`,
                hinglish: `Om Bhur Bhuva Swaha |\nTat Savitur Varenyam Bhargo Devasya Dheemahi |\nDhiyo Yo Nah Prachodayat ||`
            },
            {
                title: "Mantra Pushpanjali",
                subtitle: "मंत्र पुष्पांजली",
                devnagari: `ॐ यज्ञेन यज्ञमयजन्त देवास्तानि धर्माणि प्रथमान्यासन्।\nते ह नाकं महिमानः सचन्त यत्र पूर्वे साध्याः सन्ति देवाः॥\n\nॐ राजाधिराजाय प्रसह्यसाहिने।\nनमो वयं वैश्रवणाय कुर्महे।\nस मे कामान्कामकामाय मह्यम्।\nकामेश्वरो वैश्रवणो ददातु।\nकुबेराय वैश्रवणाय महाराजाय नमः॥\n\nॐ स्वस्ति साम्राज्यं भौज्यं स्वाराज्यं वैराज्यं...`,
                hinglish: `Om Yajnena Yajnamayajanta Devastani Dharmani Prathamanyasan |\nTe Ha Nakam Mahimanah Sachanta Yatra Purve Sadhyah Santi Devah ||\n\nOm Rajadhirajaya Prasahyasahine |\nNamo Vayam Vaishravanaya Kurmahe |\nSa Me Kamankamakamaaya Mahyam |\nKameshvaro Vaishravano Dadatu |\nKuberaya Vaishravanaya Maharajaya Namah ||`
            }
        ];

        const indexList = document.getElementById('index-list');
        const modalIndexList = document.getElementById('modal-index-list');
        const contentPages = document.getElementById('content-pages');

        aartis.forEach((aarti, index) => {
            let pageNum = index + 1;
            let id = `aarti-${pageNum}`;

            // 1. Generate Main Page Index
            let li = document.createElement('li');
            li.className = 'index-item';
            li.style.animation = `pageEntrance 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) ${index * 0.05}s both`;
            li.innerHTML = `
                <a href="#${id}">
                    <div>
                        <div class="index-name">${aarti.title}</div>
                        <div class="index-hin devnagari">${aarti.subtitle}</div>
                    </div>
                    <div class="index-pg">${pageNum}</div>
                </a>
            `;
            indexList.appendChild(li);

            // 2. Generate Modal Bottom Sheet Index
            let modalLi = document.createElement('li');
            modalLi.className = 'index-item';
            modalLi.innerHTML = `
                <a href="#${id}" onclick="closeBottomSheet()">
                    <div>
                        <div class="index-name">${aarti.title}</div>
                        <div class="index-hin devnagari">${aarti.subtitle}</div>
                    </div>
                    <div class="index-pg">${pageNum}</div>
                </a>
            `;
            modalIndexList.appendChild(modalLi);

            let layoutClass = aarti.isLong ? 'long-aarti' : '';

            // 3. Generate Page Content
            let div = document.createElement('div');
            div.className = `page ${layoutClass}`;
            div.id = id;
            div.style.animationDelay = `${0.2 + (index * 0.1)}s`;

            div.innerHTML = `
                <div class="page-inner">
                    <svg class="watermark" viewBox="0 0 100 100">
                        <text x="50" y="55" font-family="'Noto Sans Devanagari', sans-serif" font-size="70" text-anchor="middle" dominant-baseline="middle" font-weight="700">ॐ</text>
                    </svg>
                    <div class="corner-container">${injectCorners()}</div>
                    
                    <div class="page-header">
                        <h1 class="title-eng">${aarti.title}</h1>
                        <h2 class="subtitle-hin heading-font">${aarti.subtitle}</h2>
                        <div class="divider-line"></div>
                        
                        <!-- Dynamic Listen to Mom's Voice Button -->
                        <a href="https://unskyit.github.io/tusic" target="_blank" class="listen-btn">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                                <polygon points="5 3 19 12 5 21 5 3"></polygon>
                            </svg>
                            Listen to Mom's Voice
                        </a>
                    </div>
                    
                    <div class="aarti-grid">
                        <div class="aarti-column">
                            <div class="column-title devnagari">देवनागरी</div>
                            <div class="text-devnagari devnagari">${formatStanzas(aarti.devnagari)}</div>
                        </div>
                        <div class="aarti-column">
                            <div class="column-title">English</div>
                            <div class="text-hinglish">${formatStanzas(aarti.hinglish)}</div>
                        </div>
                    </div>

                    <div class="page-footer">
                        <div class="footer-family">॥ PDF by Surekha Kailash Sonar ॥</div>
                        <div class="page-number">${pageNum}</div>
                    </div>
                </div>
            `;
            contentPages.appendChild(div);
        });

        // ==========================================
        // FAB & Bottom Sheet Navigation Logic
        // ==========================================
        const fabBtn = document.getElementById('fab-btn');
        const bottomSheet = document.getElementById('bottom-sheet');
        const sheetBackdrop = document.getElementById('sheet-backdrop');
        const closeSheetBtn = document.getElementById('close-sheet');

        function openBottomSheet() {
            bottomSheet.classList.add('active');
            sheetBackdrop.classList.add('active');
            // Prevent body from scrolling while menu is open
            document.body.style.overflow = 'hidden'; 
        }

        function closeBottomSheet() {
            bottomSheet.classList.remove('active');
            sheetBackdrop.classList.remove('active');
            // Restore normal body scroll
            document.body.style.overflow = '';
        }

        // Event Listeners
        fabBtn.addEventListener('click', openBottomSheet);
        closeSheetBtn.addEventListener('click', closeBottomSheet);
        // Clicking outside the modal closes it
        sheetBackdrop.addEventListener('click', closeBottomSheet); 

    </script>
</body>
</html>
